<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/TaskHubLogo.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Вход — TaskHub</title>
</head>
<body>

<header>
    <nav>
        <ul>
            <li><img alt="TaskHub" th:src="@{/images/TaskHubLogo.png}"></li>
            <li><a th:href="@{/}">Главная</a></li>
            <li><a th:href="@{/register}">Регистрация</a></li>
            <li><a th:href="@{/login}">Вход</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Вход</h1>

    <form class="auth-form" th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button class="btn" type="submit">Войти</button>
    </form>

    <p class="msg-error" th:if="${param.error != null}">Неверный логин или пароль</p>
    <p class="msg-success" th:if="${param.success != null}">Регистрация успешна! Войдите в систему.</p>
    <p class="msg-error" th:if="${param.logout != null}">Вы вышли из системы.</p>

    <p style="text-align:center;">
        Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
    </p>
</main>

<footer>
    <div>
        <a th:href="@{/profile}">О нас</a>
        <a th:href="@{/profile}">Политика конфиденциальности</a>
        <p>© 2026 TaskHub Freelance</p>
    </div>
</footer>

</body>
</html>
