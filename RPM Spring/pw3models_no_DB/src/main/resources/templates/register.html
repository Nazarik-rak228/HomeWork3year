<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/images/TaskHubLogo.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Регистрация — TaskHub</title>
</head>
<body>

<header>
    <nav>
        <ul>
            <li><img alt="TaskHub" th:src="@{/images/TaskHubLogo.png}"></li>
            <li><a th:href="@{/}">Главная</a></li>
            <li><a th:href="@{/register}">Регистрация</a></li>
            <li><a th:href="@{/login}">Вход</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Регистрация</h1>

    <form class="auth-form" method="post" th:action="@{/register}">
        <input type="text" name="username" placeholder="Имя пользователя (от 3 символов)" minlength="3" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Пароль (минимум 6 символов)" minlength="6" required>
        <button class="btn" type="submit">Зарегистрироваться</button>
    </form>

    <p class="msg-error" th:if="${param.error == 'exists'}">Пользователь с таким именем уже существует.</p>
    <p class="msg-error" th:if="${param.error == 'validation'}">Проверьте корректность введённых данных.</p>

    <p style="text-align:center;">
        Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
    </p>
</main>

<footer>
    <div>
        <a th:href="@{/profile}">О нас</a>
        <a th:href="@{/profile}">Политика конфиденциальности</a>
        <p>© 2026 TaskHub Freelance</p>
    </div>
</footer>

</body>
</html>
