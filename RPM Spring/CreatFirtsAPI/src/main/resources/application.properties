spring.application.name=CreatFirtsAPI
spring.datasource.url=jdbc:postgresql://localhost:5432/javaSpringBD
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8082
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== JWT авторизация =====
# Секретный ключ для подписи токенов (минимум 32 символа для HS256)
jwt.secret=TaskHubJwtSecretKey2026!SuperSecretValueForHS256Token
# Срок жизни токена в миллисекундах (24 часа)
jwt.expiration-ms=86400000

logging.level.org.springframework.security=INFO